<script>
(function(){
  const TIMEOUT_MS  = 7 * 60 * 1000;
  const AVISO_MS    = 6 * 60 * 1000;
  let timerTimeout, timerAviso;
  let avisoEl = null;
  const STORAGE_KEY = 'hub_last_activity';

  // Sincroniza atividade entre abas
  window.addEventListener('storage', function(e){
    if(e.key === STORAGE_KEY && !avisoEl){ resetTimer(); }
  });

  function registrarAtividade(){
    try{ localStorage.setItem(STORAGE_KEY, Date.now()); }catch(e){}
    if(!avisoEl) resetTimer();
  }

  function criarAviso(){
    if(avisoEl) return;
    avisoEl = document.createElement('div');
    avisoEl.id = 'aviso-inatividade';
    avisoEl.innerHTML = `
      <div style="position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9999;display:flex;align-items:center;justify-content:center">
        <div style="background:#161b22;border:1px solid #f85149;border-radius:12px;padding:28px 32px;text-align:center;max-width:360px">
          <div style="font-size:32px;margin-bottom:12px">⏰</div>
          <div style="font-size:16px;font-weight:700;color:#e6edf3;margin-bottom:8px">Sessão expirando!</div>
          <div style="font-size:13px;color:#8b949e;margin-bottom:20px">Você ficará deslogado por inatividade em <b id="contagem" style="color:#f85149">60s</b></div>
          <button onclick="continuarSessao()" style="padding:10px 24px;border-radius:8px;background:#00c8a0;color:#0d1117;border:none;font-size:14px;font-weight:700;cursor:pointer">✅ Continuar sessão</button>
        </div>
      </div>`;
    document.body.appendChild(avisoEl);

    // Contagem regressiva
    let seg = 60;
    const interval = setInterval(()=>{
      seg--;
      const el = document.getElementById('contagem');
      if(el) el.textContent = seg + 's';
      if(seg <= 0){ clearInterval(interval); deslogar(); }
    }, 1000);
    avisoEl._interval = interval;
  }

  function removerAviso(){
    if(avisoEl){
      clearInterval(avisoEl._interval);
      avisoEl.remove();
      avisoEl = null;
    }
  }

  function deslogar(){
    // Avisa servidor que foi por inatividade
    fetch('/api/logout-inatividade', {method:'POST', credentials:'include'})
      .catch(()=>{})
      .finally(()=>{ window.location.href = '/logout?motivo=inatividade'; });
  }

  window.continuarSessao = function(){
    removerAviso();
    resetTimer();
  };

  function resetTimer(){
    clearTimeout(timerTimeout);
    clearTimeout(timerAviso);
    timerAviso = setTimeout(()=>{ criarAviso(); }, AVISO_MS);
    timerTimeout = setTimeout(()=>{ deslogar(); }, TIMEOUT_MS);
  }

  // Eventos de atividade
  ['mousemove','mousedown','keydown','scroll','touchstart','click'].forEach(ev=>{
    document.addEventListener(ev, registrarAtividade, {passive:true});
  });

  // Inicia
  resetTimer();
})();
</script>
<script>
(function(){
  const params = new URLSearchParams(window.location.search);
  const msg = params.get('boas_vindas');
  if(!msg) return;

  const el = document.createElement('div');
  el.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#059669;color:#fff;padding:12px 24px;border-radius:10px;font-size:14px;font-weight:600;z-index:9999;box-shadow:0 4px 20px rgba(5,150,105,.3);display:flex;align-items:center;gap:10px;animation:slideUp .3s ease';
  el.innerHTML = `<span style="font-size:20px">👋</span><span>${msg}</span>`;
  document.body.appendChild(el);

  const style = document.createElement('style');
  style.textContent = '@keyframes slideUp{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}';
  document.head.appendChild(style);

  setTimeout(() => {
    el.style.animation = 'slideUp .3s ease reverse';
    setTimeout(() => el.remove(), 300);
  }, 4000);

  // Remove da URL sem recarregar
  const url = new URL(window.location);
  url.searchParams.delete('boas_vindas');
  window.history.replaceState({}, '', url);
})();
</script>
