<div id="briefing-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9998;align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:14px;padding:28px 32px;max-width:480px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.2)">
    <div style="text-align:center;margin-bottom:20px">
      <div style="font-size:32px;margin-bottom:8px">☀️</div>
      <div style="font-size:18px;font-weight:700;color:#1e293b" id="briefing-titulo">Bom dia!</div>
      <div style="font-size:13px;color:#64748b;margin-top:4px">Aqui estão suas prioridades de hoje</div>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:20px" id="briefing-itens"></div>

    <div style="background:#f8fafc;border-radius:8px;padding:12px;font-size:12px;color:#64748b;margin-bottom:20px">
      💡 <b>Ordem sugerida:</b> Promessas quebradas → Segunda cobrança → Fila de cobrança
    </div>

    <button onclick="confirmarBriefing()" style="width:100%;padding:12px;border-radius:8px;background:#059669;color:#fff;border:none;font-size:14px;font-weight:700;cursor:pointer">
      ✅ Estou ciente — Iniciar atendimento
    </button>
  </div>
</div>

<script>
async function carregarBriefing(){
  try{
    const r = await fetch('/cobranca/api/briefing-diario');
    const d = await r.json();
    if(!d.mostrar) return;

    const hora = new Date().getHours();
    const sauda = hora < 12 ? '☀️ Bom dia' : hora < 18 ? '🌤️ Boa tarde' : '🌙 Boa noite';
    document.getElementById('briefing-titulo').textContent = `${sauda}, ${d.nome}!`;

    const itens = [];
    if(d.promessas_quebradas > 0)
      itens.push(`<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#fef2f2;border-radius:8px;border-left:4px solid #dc2626">
        <div><div style="font-size:13px;font-weight:600;color:#1e293b">🔴 Promessas Quebradas</div><div style="font-size:11px;color:#64748b">Clientes que prometeram e não pagaram</div></div>
        <div style="font-size:22px;font-weight:700;color:#dc2626">${d.promessas_quebradas}</div></div>`);
    if(d.segunda_cobranca > 0)
      itens.push(`<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#fffbeb;border-radius:8px;border-left:4px solid #d97706">
        <div><div style="font-size:13px;font-weight:600;color:#1e293b">🟡 Segunda Cobrança</div><div style="font-size:11px;color:#64748b">Clientes já contactados anteriormente</div></div>
        <div style="font-size:22px;font-weight:700;color:#d97706">${d.segunda_cobranca}</div></div>`);
    if(d.primeira_cobranca > 0)
      itens.push(`<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#f0fdf4;border-radius:8px;border-left:4px solid #059669">
        <div><div style="font-size:13px;font-weight:600;color:#1e293b">🟢 Fila de Cobrança</div><div style="font-size:11px;color:#64748b">Primeiros contatos do dia</div></div>
        <div style="font-size:22px;font-weight:700;color:#059669">${d.primeira_cobranca}</div></div>`);

    if(itens.length === 0)
      itens.push(`<div style="text-align:center;padding:20px;color:#059669;font-weight:600">🎉 Nenhuma pendência! Ótimo trabalho!</div>`);

    document.getElementById('briefing-itens').innerHTML = itens.join('');
    document.getElementById('briefing-overlay').style.display = 'flex';
  } catch(e){ console.log('Briefing erro:', e); }
}

async function confirmarBriefing(){
  await fetch('/cobranca/api/briefing-ciencia', {method:'POST'});
  document.getElementById('briefing-overlay').style.display = 'none';
}

document.addEventListener('DOMContentLoaded', carregarBriefing);
</script>
